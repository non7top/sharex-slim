name: Build ShareX-slim

on:
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths-ignore:
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]

    env:
      SOLUTION_FILE_PATH: ShareX.Slim.sln
      PLATFORM: x64
      RUNTIME_ID: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore NuGet packages
        run: dotnet restore --runtime "${{ env.RUNTIME_ID }}" "${{ env.SOLUTION_FILE_PATH }}"

      - name: Build
        run: >
          dotnet build --no-restore
          --configuration "${{ matrix.configuration }}"
          -p:Platform="${{ env.PLATFORM }}"
          --self-contained true /m:1
          "${{ env.SOLUTION_FILE_PATH }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ShareX-slim-${{ matrix.configuration }}-${{ env.PLATFORM }}
          path: ShareX/bin/${{ matrix.configuration }}/${{ env.RUNTIME_ID }}/
